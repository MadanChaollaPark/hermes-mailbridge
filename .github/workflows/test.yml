name: Mailbridge checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: 78abaafcccec20a546c94e8734a70e38c08a6a69
          path: .hermes-source
      - run: python -m pip install -r requirements-dev.txt -r legacy/requirements.txt
      - name: Catalog package tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-source
        run: python -m unittest discover -s tests -v
      - name: Real Hermes registry and OAuth boundary
        run: python plugin/tests/hermes_smoke.py --hermes-source .hermes-source
      - name: Legacy regression suite
        working-directory: legacy
        run: python -m unittest discover -s tests -v
      - name: Catalog admission checks
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-source
        run: |
          python - <<'PY'
          from pathlib import Path
          from hermes_cli.plugin_validate import validate_plugin_dir
          result = validate_plugin_dir(Path('plugin').resolve())
          print(result.to_dict())
          raise SystemExit(result.exit_code)
          PY
